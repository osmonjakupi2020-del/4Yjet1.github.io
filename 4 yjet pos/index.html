<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OweTrack Pro — Menaxhimi i Kafe-Barit</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Standalone -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const USERS = [
      { id: 'osman', name: 'Osman Jakupi', username: 'osman.jakupi', pass: 'pass1234', role: 'USER' },
      { id: 'gzim', name: 'Gzim Jakupi', username: 'gzim.jakupi', pass: 'pass1234', role: 'ADMIN' },
    ];

    const MENU_ITEMS = [
      { name: 'Makiato', price: 0.80 },
      { name: 'Espresso', price: 0.70 },
      { name: 'Çaj', price: 0.70 },
    ];

    const getNowDateTimeString = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 16);
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [usernameInput, setUsernameInput] = useState('osman.jakupi');
      const [passwordInput, setPasswordInput] = useState('pass1234');
      const [activeTab, setActiveTab] = useState('pos');

      const [debts, setDebts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);

      const [customerName, setCustomerName] = useState('');
      const [cart, setCart] = useState([]);
      const [customTitle, setCustomTitle] = useState('');
      const [customPrice, setCustomPrice] = useState('1.00');
      const [recordDateTime, setRecordDateTime] = useState(getNowDateTimeString());

      useEffect(() => {
        const savedDebts = localStorage.getItem('owetrack_debts');
        const savedOrders = localStorage.getItem('owetrack_orders');
        const savedLogs = localStorage.getItem('owetrack_logs');

        if (savedDebts) setDebts(JSON.parse(savedDebts));
        if (savedOrders) setOrders(JSON.parse(savedOrders));
        if (savedLogs) setAuditLogs(JSON.parse(savedLogs));
      }, []);

      useEffect(() => {
        localStorage.setItem('owetrack_debts', JSON.stringify(debts));
      }, [debts]);

      useEffect(() => {
        localStorage.setItem('owetrack_orders', JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem('owetrack_logs', JSON.stringify(auditLogs));
      }, [auditLogs]);

      const handleLogin = (e) => {
        e.preventDefault();
        const found = USERS.find(u => u.username === usernameInput && u.pass === passwordInput);
        if (found) {
          setCurrentUser(found);
          addLog('HYRJE', `${found.name} u kyç në sistem`);
        } else {
          alert('Emri i përdoruesit ose fjalëkalimi është i gabuar!');
        }
      };

      const handleLogout = () => {
        if (currentUser) addLog('DALJE', `${currentUser.name} doli nga sistemi`);
        setCurrentUser(null);
      };

      const addLog = (type, details) => {
        const newLog = {
          id: Date.now().toString(),
          type,
          details,
          performedBy: currentUser ? currentUser.name : 'Sistemi',
          time: new Date().toLocaleString('sq-AL', { dateStyle: 'short', timeStyle: 'short' }),
        };
        setAuditLogs(prev => [newLog, ...prev]);
      };

      const addToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.name === item.name && i.price === item.price);
          if (existing) {
            return prev.map(i => i.name === item.name && i.price === item.price ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...item, qty: 1, cartId: Date.now().toString() + Math.random() }];
        });
      };

      const updateCartQty = (cartId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartId !== cartId) return item;
          const newQty = item.qty + delta;
          return newQty > 0 ? { ...item, qty: newQty } : null;
        }).filter(Boolean));
      };

      const removeFromCart = (cartId) => {
        setCart(prev => prev.filter(item => item.cartId !== cartId));
      };

      const addCustomToCart = () => {
        const priceNum = parseFloat(customPrice);
        if (!customTitle.trim()) {
          alert('Ju lutem shkruani emrin e artikullit.');
          return;
        }
        if (isNaN(priceNum) || priceNum < 1 || priceNum > 100) {
          alert('Çmimi duhet të jetë mes €1.00 dhe €100.00');
          return;
        }
        addToCart({ name: customTitle, price: priceNum });
        setCustomTitle('');
        setCustomPrice('1.00');
      };

      const formatGroupedItems = (cartItems) => {
        return cartItems.map(i => `${i.qty}x ${i.name}`).join(', ');
      };

      // Merge items into existing customer tab if confirmed
      const saveCartTransaction = (type = 'DEBT') => {
        const trimmedName = customerName.trim();
        if (!trimmedName) {
          alert('Ju lutem shkruani emrin e klientit ose numrin e tavolinës.');
          return;
        }
        if (cart.length === 0) {
          alert('Shporta është e zbrazët. Shtoni të paktën një artikull.');
          return;
        }

        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const itemSummary = formatGroupedItems(cart);
        const formattedDate = recordDateTime ? new Date(recordDateTime).toLocaleString('sq-AL', { dateStyle: 'short', timeStyle: 'short' }) : new Date().toLocaleString('sq-AL', { dateStyle: 'short', timeStyle: 'short' });

        // Check if customer already exists in active debts/orders
        const existingDebt = type === 'DEBT' ? activeDebts.find(d => d.customer.toLowerCase() === trimmedName.toLowerCase()) : null;

        if (existingDebt) {
          const isSamePerson = confirm(`A është ky personi i njëjtë si "${existingDebt.customer}" që ka tashmë një tab aktive? Klikoni OK për ta shtuar te i njëjti tab, ose Anulo (Cancel) për ta krijuar si klient të ri.`);
          
          if (isSamePerson) {
            if (type === 'DEBT') {
              setDebts(prev => prev.map(d => {
                if (d.id !== existingDebt.id) return d;
                return {
                  ...d,
                  item: `${d.item}, ${itemSummary}`,
                  amount: d.amount + totalPrice,
                  dateTime: formattedDate
                };
              }));
              addLog('BORXHI_UPDATE', `U shtuan €${totalPrice.toFixed(2)} [${itemSummary}] te tab-i ekzistues i ${existingDebt.customer}`);
              setCart([]);
              setCustomerName('');
              setRecordDateTime(getNowDateTimeString());
              alert('U shtua me sukses te tab-i ekzistues i klientit!');
              return;
            }
          }
        }

        if (type === 'DEBT') {
          const newDebt = {
            id: Date.now().toString(),
            customer: trimmedName,
            item: itemSummary,
            amount: totalPrice,
            paid: 0,
            status: 'PA LIPUR',
            createdBy: currentUser.name,
            dateTime: formattedDate,
            deleted: false,
          };
          setDebts(prev => [newDebt, ...prev]);
          addLog('BORXHI_KRIJUAR', `U krijua borxh prej €${totalPrice.toFixed(2)} [${itemSummary}] për ${trimmedName}`);
        } else {
          const newOrder = {
            id: Date.now().toString(),
            customer: trimmedName,
            item: itemSummary,
            amount: totalPrice,
            status: 'NE PRITJE',
            createdBy: currentUser.name,
            dateTime: formattedDate,
            deleted: false,
          };
          setOrders(prev => [newOrder, ...prev]);
          addLog('POROSIA_KRIJUAR', `U dërgua porosi prej €${totalPrice.toFixed(2)} [${itemSummary}] për ${trimmedName}`);
        }

        setCart([]);
        setCustomerName('');
        setRecordDateTime(getNowDateTimeString());
        alert('U ruajt me sukses!');
      };

      const handlePayment = (debtId, payAmount) => {
        setDebts(prev => prev.map(d => {
          if (d.id !== debtId) return d;
          const newPaid = d.paid + payAmount;
          const newStatus = newPaid >= d.amount ? 'I PAGUAR' : 'PAGESË PJESORE';
          return { ...d, paid: newPaid, status: newStatus };
        }));
        const target = debts.find(d => d.id === debtId);
        addLog('PAGESA', `U regjistrua pagesë prej €${payAmount.toFixed(2)} për ${target.customer}`);
      };

      const handleOrderApproval = (orderId, approved) => {
        const order = orders.find(o => o.id === orderId);
        if (order.createdBy === currentUser.name) {
          alert('Politika e Aprovimit: Nuk mund të aprovoni ose refuzoni porosinë tuaj!');
          return;
        }

        setOrders(prev => prev.map(o => {
          if (o.id !== orderId) return o;
          return { ...o, status: approved ? 'APROVUAR' : 'REFUZUAR', approvedBy: currentUser.name };
        }));

        addLog(approved ? 'POROSIA_APROVUAR' : 'POROSIA_REFUZUAR', `${currentUser.name} ${approved ? 'aprovoi' : 'refuzoi'} porosinë për ${order.customer}`);
      };

      const handleDelete = (id, type) => {
        if (!confirm('A jeni i sigurt që dëshironi ta fshini këtë regjistrim?')) return;

        if (type === 'DEBT') {
          setDebts(prev => prev.map(d => d.id === id ? { ...d, deleted: true } : d));
        } else {
          setOrders(prev => prev.map(o => o.id === id ? { ...o, deleted: true } : o));
        }

        addLog('ALARM_FSIRJE', `[ALARM PËR ADMIN] ${currentUser.name} fshiu një regjistrim ${type} (ID: ${id})`);
      };

      const handleRestore = (id, type) => {
        if (type === 'DEBT') {
          setDebts(prev => prev.map(d => d.id === id ? { ...d, deleted: false } : d));
        } else {
          setOrders(prev => prev.map(o => o.id === id ? { ...o, deleted: false } : o));
        }
        addLog('RIKTHIM', `${currentUser.name} riktheu regjistrimin ${type} (ID: ${id})`);
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gray-900 text-white p-4">
            <div className="bg-gray-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-gray-700">
              <h1 className="text-2xl font-bold text-amber-400 mb-2 text-center">☕ OweTrack Pro</h1>
              <p className="text-gray-400 text-sm mb-6 text-center">Sistemi i Borxheve dhe Porosive për Kafe-Bar</p>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase text-gray-400 mb-1">Zgjidhni Përdoruesin</label>
                  <select
                    className="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white font-medium"
                    value={usernameInput}
                    onChange={(e) => setUsernameInput(e.target.value)}
                  >
                    <option value="osman.jakupi">Osman Jakupi (Staf)</option>
                    <option value="gzim.jakupi">Gzim Jakupi (Administrator Kryesor)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase text-gray-400 mb-1">Fjalëkalimi</label>
                  <input
                    type="password"
                    className="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    required
                  />
                  <p className="text-xs text-gray-400 mt-1">Fjalëkalimi parazgjedhje: <code className="text-amber-300">pass1234</code></p>
                </div>

                <button
                  type="submit"
                  className="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 rounded transition"
                >
                  Kyçu në Sistem
                </button>
              </form>
            </div>
          </div>
        );
      }

      const activeDebts = debts.filter(d => !d.deleted);
      const activeOrders = orders.filter(o => !o.deleted);
      const deletedItems = [
        ...debts.filter(d => d.deleted).map(d => ({ ...d, recordType: 'BORXH' })),
        ...orders.filter(o => o.deleted).map(o => ({ ...o, recordType: 'POROSI' })),
      ];

      const customerMap = {};
      activeDebts.forEach(d => {
        if (!customerMap[d.customer]) {
          customerMap[d.customer] = { customer: d.customer, totalAmount: 0, totalPaid: 0, activeTabsCount: 0 };
        }
        customerMap[d.customer].totalAmount += d.amount;
        customerMap[d.customer].totalPaid += d.paid;
        customerMap[d.customer].activeTabsCount += 1;
      });
      const customersList = Object.values(customerMap).map(c => ({
        ...c,
        remaining: c.totalAmount - c.totalPaid
      }));

      return (
        <div className="min-h-screen bg-gray-100 flex flex-col">
          <header className="bg-gray-900 text-white p-4 flex justify-between items-center shadow-md">
            <div className="flex items-center space-x-3">
              <span className="text-2xl">☕</span>
              <div>
                <h1 className="font-bold text-lg leading-none text-amber-400">OweTrack Pro</h1>
                <span className="text-xs text-gray-400">Menaxhimi i Kafe-Barit</span>
              </div>
            </div>
            
            <div className="flex items-center space-x-4 text-sm">
              <span className="bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
                Përdoruesi: <strong className="text-amber-300">{currentUser.name}</strong> ({currentUser.role === 'ADMIN' ? 'Admin' : 'Staf'})
              </span>
              <button
                onClick={handleLogout}
                className="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold transition"
              >
                Dil (Logout)
              </button>
            </div>
          </header>

          <nav className="bg-white border-b border-gray-200 px-4 flex space-x-2 overflow-x-auto">
            <button
              onClick={() => setActiveTab('pos')}
              className={`py-3 px-4 font-semibold text-sm border-b-2 whitespace-nowrap transition ${
                activeTab === 'pos' ? 'border-amber-500 text-amber-600' : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              ➕ Arkë / Porosi e Re
            </button>
            <button
              onClick={() => setActiveTab('debts')}
              className={`py-3 px-4 font-semibold text-sm border-b-2 whitespace-nowrap transition ${
                activeTab === 'debts' ? 'border-amber-500 text-amber-600' : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              📋 Borxhet e Klientëve ({activeDebts.length})
            </button>
            <button
              onClick={() => setActiveTab('people')}
              className={`py-3 px-4 font-semibold text-sm border-b-2 whitespace-nowrap transition ${
                activeTab === 'people' ? 'border-amber-500 text-amber-600' : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              👥 Njerëzit / Klientët ({customersList.length})
            </button>
            <button
              onClick={() => setActiveTab('orders')}
              className={`py-3 px-4 font-semibold text-sm border-b-2 whitespace-nowrap transition ${
                activeTab === 'orders' ? 'border-amber-500 text-amber-600' : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              ⏳ Aprovimet në Pritje ({activeOrders.filter(o => o.status === 'NE PRITJE').length})
            </button>
            {currentUser.role === 'ADMIN' && (
              <button
                onClick={() => setActiveTab('admin')}
                className={`py-3 px-4 font-semibold text-sm border-b-2 whitespace-nowrap transition ${
                  activeTab === 'admin' ? 'border-red-500 text-red-600' : 'border-transparent text-gray-500 hover:text-gray-700'
                }`}
              >
                🛡️ Gzim Admin Vault ({deletedItems.length})
              </button>
            )}
          </nav>

          <main className="flex-1 p-6 max-w-6xl w-full mx-auto">
            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-2 space-y-6">
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 className="text-lg font-bold text-gray-800 mb-4">1. Klienti dhe Koha</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase text-gray-500 mb-1">Emri i Klientit / Tavolina</label>
                        <input
                          type="text"
                          placeholder="psh. Tavolina 4 ose Alban..."
                          className="w-full text-base p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"
                          value={customerName}
                          onChange={(e) => setCustomerName(e.target.value)}
                        />
                      </div>
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-xs font-bold uppercase text-gray-500">Data dhe Ora</label>
                          <button
                            type="button"
                            onClick={() => setRecordDateTime(getNowDateTimeString())}
                            className="text-xs font-bold text-amber-600 hover:underline"
                          >
                            Koha Tani
                          </button>
                        </div>
                        <input
                          type="datetime-local"
                          className="w-full text-base p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"
                          value={recordDateTime}
                          onChange={(e) => setRecordDateTime(e.target.value)}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 className="text-lg font-bold text-gray-800 mb-4">2. Pijet e Shpejta</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      {MENU_ITEMS.map((item) => (
                        <button
                          key={item.name}
                          onClick={() => addToCart(item)}
                          className="border border-amber-200 bg-amber-50 hover:bg-amber-100 rounded-lg p-4 text-left transition flex flex-col justify-between"
                        >
                          <div>
                            <h3 className="font-bold text-gray-900 text-lg">{item.name}</h3>
                            <p className="text-amber-700 font-extrabold text-xl">€{item.price.toFixed(2)}</p>
                          </div>
                          <span className="text-xs font-bold text-amber-600 mt-3">+ Shto në Shportë</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 className="text-lg font-bold text-gray-800 mb-4">3. Artikull me Çmim Unik (€1.00 - €100.00)</h2>
                    <div className="flex flex-col sm:flex-row gap-3">
                      <input
                        type="text"
                        placeholder="Emri i artikullit (psh. Sendviç)"
                        className="flex-1 p-2 border border-gray-300 rounded"
                        value={customTitle}
                        onChange={(e) => setCustomTitle(e.target.value)}
                      />
                      <input
                        type="number"
                        min="1"
                        max="100"
                        step="0.5"
                        className="w-28 p-2 border border-gray-300 rounded"
                        value={customPrice}
                        onChange={(e) => setCustomPrice(e.target.value)}
                      />
                      <button
                        onClick={addCustomToCart}
                        className="bg-gray-800 hover:bg-gray-900 text-white font-bold px-4 py-2 rounded text-sm"
                      >
                        + Shto
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between h-fit sticky top-6">
                  <div>
                    <h2 className="text-lg font-bold text-gray-800 border-b pb-3 mb-4">🛒 Shporta Aktuale</h2>
                    {cart.length === 0 ? (
                      <p className="text-gray-400 text-sm py-8 text-center">Nuk ka artikuj në shportë.</p>
                    ) : (
                      <div className="space-y-3 max-h-72 overflow-y-auto mb-4">
                        {cart.map((item) => (
                          <div key={item.cartId} className="flex justify-between items-center bg-gray-50 p-2.5 rounded border">
                            <div>
                              <p className="font-bold text-sm text-gray-900">{item.qty}x {item.name}</p>
                              <p className="text-xs font-bold text-amber-600">€{(item.price * item.qty).toFixed(2)} (€{item.price.toFixed(2)} copë)</p>
                            </div>
                            <div className="flex items-center space-x-1">
                              <button
                                onClick={() => updateCartQty(item.cartId, -1)}
                                className="w-6 h-6 bg-gray-200 hover:bg-gray-300 rounded font-bold text-xs"
                              >
                                -
                              </button>
                              <span className="text-xs font-bold px-1">{item.qty}</span>
                              <button
                                onClick={() => updateCartQty(item.cartId, 1)}
                                className="w-6 h-6 bg-gray-200 hover:bg-gray-300 rounded font-bold text-xs"
                              >
                                +
                              </button>
                              <button
                                onClick={() => removeFromCart(item.cartId)}
                                className="text-red-500 hover:text-red-700 text-xs font-bold pl-2"
                              >
                                ✕
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {cart.length > 0 && (
                    <div className="border-t pt-4 space-y-3">
                      <div className="flex justify-between text-base font-bold">
                        <span>Totali:</span>
                        <span className="text-amber-600">€{cart.reduce((sum, i) => sum + (i.price * i.qty), 0).toFixed(2)}</span>
                      </div>
                      <button
                        onClick={() => saveCartTransaction('DEBT')}
                        className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded text-sm transition"
                      >
                        Ruaj si Borxh i Klientit
                      </button>
                      <button
                        onClick={() => saveCartTransaction('ORDER')}
                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded text-sm transition"
                      >
                        Dërgo për Aprovim
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'debts' && (
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div className="p-4 bg-gray-50 border-b border-gray-200 font-bold text-gray-700">
                  Regjistri i Borxheve Aktive
                </div>
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-gray-100 text-xs font-semibold text-gray-600 uppercase border-b">
                      <th className="p-3">Data & Ora</th>
                      <th className="p-3">Klienti</th>
                      <th className="p-3">Artikujt e Grupuar</th>
                      <th className="p-3">Totali</th>
                      <th className="p-3">E Paguar</th>
                      <th className="p-3">Mbetur</th>
                      <th className="p-3">Statusi</th>
                      <th className="p-3">Veprimet</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200 text-sm">
                    {activeDebts.length === 0 ? (
                      <tr>
                        <td colSpan="8" className="p-6 text-center text-gray-400">Nuk u gjet asnjë borxh aktiv.</td>
                      </tr>
                    ) : (
                      activeDebts.map(d => {
                        const remaining = d.amount - d.paid;
                        return (
                          <tr key={d.id} className="hover:bg-gray-50">
                            <td className="p-3 text-xs text-gray-500">{d.dateTime || '—'}</td>
                            <td className="p-3 font-semibold">{d.customer}</td>
                            <td className="p-3 text-gray-800 font-medium text-xs bg-amber-50 rounded">{d.item}</td>
                            <td className="p-3 font-bold">€{d.amount.toFixed(2)}</td>
                            <td className="p-3 text-green-600 font-bold">€{d.paid.toFixed(2)}</td>
                            <td className="p-3 font-bold text-red-600">€{remaining.toFixed(2)}</td>
                            <td className="p-3">
                              <span className={`px-2 py-1 rounded-full text-xs font-bold ${
                                d.status === 'I PAGUAR' ? 'bg-green-100 text-green-700' :
                                d.status === 'PAGESË PJESORE' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'
                              }`}>
                                {d.status}
                              </span>
                            </td>
                            <td className="p-3 flex space-x-2">
                              {d.status !== 'I PAGUAR' && (
                                <button
                                  onClick={() => handlePayment(d.id, remaining)}
                                  className="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs font-bold"
                                >
                                  Paguaj Plotësisht
                                </button>
                              )}
                              <button
                                onClick={() => handleDelete(d.id, 'DEBT')}
                                className="bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded text-xs font-bold"
                              >
                                Fshi
                              </button>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'people' && (
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div className="p-4 bg-gray-50 border-b border-gray-200 font-bold text-gray-700">
                  Përmbledhja e Borxheve sipas Klientëve
                </div>
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-gray-100 text-xs font-semibold text-gray-600 uppercase border-b">
                      <th className="p-3">Emri i Klientit / Tavolina</th>
                      <th className="p-3">Tab-e Aktive</th>
                      <th className="p-3">Totali i Krijuar</th>
                      <th className="p-3">Totali i Paguar</th>
                      <th className="p-3">Borxhi Total i Mbetur</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200 text-sm">
                    {customersList.length === 0 ? (
                      <tr>
                        <td colSpan="5" className="p-6 text-center text-gray-400">Nuk ka klientë me borxhe aktive.</td>
                      </tr>
                    ) : (
                      customersList.map(c => (
                        <tr key={c.customer} className="hover:bg-gray-50">
                          <td className="p-3 font-bold text-gray-900">{c.customer}</td>
                          <td className="p-3 text-gray-600">{c.activeTabsCount} tab(e)</td>
                          <td className="p-3">€{c.totalAmount.toFixed(2)}</td>
                          <td className="p-3 text-green-600">€{c.totalPaid.toFixed(2)}</td>
                          <td className="p-3 font-extrabold text-red-600 text-base">€{c.remaining.toFixed(2)}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'orders' && (
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div className="p-4 bg-gray-50 border-b border-gray-200 font-bold text-gray-700">
                  Porositë në Pritje të Aprovimit
                </div>
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-gray-100 text-xs font-semibold text-gray-600 uppercase border-b">
                      <th className="p-3">Data & Ora</th>
                      <th className="p-3">Klienti</th>
                      <th className="p-3">Artikujt</th>
                      <th className="p-3">Shuma</th>
                      <th className="p-3">Krijuar Nga</th>
                      <th className="p-3">Statusi</th>
                      <th className="p-3">Veprimet</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200 text-sm">
                    {activeOrders.length === 0 ? (
                      <tr>
                        <td colSpan="7" className="p-6 text-center text-gray-400">Nuk ka porosi në pritje.</td>
                      </tr>
                    ) : (
                      activeOrders.map(o => (
                        <tr key={o.id} className="hover:bg-gray-50">
                          <td className="p-3 text-xs text-gray-500">{o.dateTime || '—'}</td>
                          <td className="p-3 font-semibold">{o.customer}</td>
                          <td className="p-3 text-gray-800 font-medium text-xs bg-amber-50 rounded">{o.item}</td>
                          <td className="p-3 font-bold">€{o.amount.toFixed(2)}</td>
                          <td className="p-3 text-gray-500">{o.createdBy}</td>
                          <td className="p-3">
                            <span className={`px-2 py-1 rounded-full text-xs font-bold ${
                              o.status === 'APROVUAR' ? 'bg-green-100 text-green-700' :
                              o.status === 'REFUZUAR' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'
                            }`}>
                              {o.status}
                            </span>
                          </td>
                          <td className="p-3 flex space-x-2">
                            {o.status === 'NE PRITJE' && (
                              <>
                                <button
                                  onClick={() => handleOrderApproval(o.id, true)}
                                  className="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs font-bold"
                                >
                                  Aprovo
                                </button>
                                <button
                                  onClick={() => handleOrderApproval(o.id, false)}
                                  className="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs font-bold"
                                >
                                  Refuzo
                                </button>
                              </>
                            )}
                            <button
                              onClick={() => handleDelete(o.id, 'ORDER')}
                              className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded text-xs font-bold"
                            >
                              Fshi
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'admin' && currentUser.role === 'ADMIN' && (
              <div className="space-y-6">
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                  <h2 className="text-lg font-bold text-red-600 mb-4">🛡️ Arkiva e Fshirjeve (Gzim Admin Vault)</h2>
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-gray-100 text-xs font-semibold text-gray-600 uppercase border-b">
                        <th className="p-3">Lloji</th>
                        <th className="p-3">Data & Ora</th>
                        <th className="p-3">Klienti</th>
                        <th className="p-3">Artikujt</th>
                        <th className="p-3">Shuma</th>
                        <th className="p-3">Veprimi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-200 text-sm">
                      {deletedItems.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="p-6 text-center text-gray-400">Arkiva është e pastër. Nuk ka regjistrime të fshira.</td>
                        </tr>
                      ) : (
                        deletedItems.map(item => (
                          <tr key={item.id} className="bg-red-50">
                            <td className="p-3 font-bold text-red-700">{item.recordType}</td>
                            <td className="p-3 text-xs text-gray-500">{item.dateTime || '—'}</td>
                            <td className="p-3">{item.customer}</td>
                            <td className="p-3 text-xs">{item.item}</td>
                            <td className="p-3 font-bold">€{item.amount.toFixed(2)}</td>
                            <td className="p-3">
                              <button
                                onClick={() => handleRestore(item.id, item.recordType === 'BORXH' ? 'DEBT' : 'ORDER')}
                                className="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs font-bold"
                              >
                                Rikthe Regjistrimin
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                  <h2 className="text-lg font-bold text-gray-800 mb-4">📜 Historiku i Veprimeve në Sistem (Audit Trail)</h2>
                  <div className="space-y-2 max-h-60 overflow-y-auto">
                    {auditLogs.map(log => (
                      <div key={log.id} className="text-xs p-2 bg-gray-50 rounded border border-gray-100 flex justify-between">
                        <span><strong>{log.performedBy}</strong>: {log.details}</span>
                        <span className="text-gray-400">{log.time}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
